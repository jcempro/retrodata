# ------------ A - System Options ----------- #

system.services=symlink_manager custom_service_handler

## Kodi (mantido)
kodi.enabled=1
kodi.atstartup=0
kodi.xbutton=1

## Splash
splash.screen.enabled=1
splash.screen.sound=1


# ------------ B - Network ------------ #

system.hostname=BATOCERA
wifi.enabled=0


# ------------ C - Audio ------------ #

audio.device=auto
audio.volume=40
audio.volume.boost=100
audio.bgmusic=1


# -------------- D - Controllers ----------------- #

controllers.bluetooth.enabled=1
controllers.ps3.enabled=1
controllers.ps3.driver=bluez
controllers.xarcade.enabled=1

## DNS com bloqueio (AdGuard)
system.dns1=94.140.14.14
system.dns2=94.140.15.15

# ------------ F - Language and Keyboard ------------ #

system.language=pt_BR
system.kblayout=br
system.timezone=America/Sao_Paulo


# ------------ G - Updates ------------ #

updates.enabled=1
updates.type=stable


# ------------ H - Global Emulator Configuration ------------ #

## Resolução base segura
es.resolution=max-1920x1080

## 🔒 BASE NEUTRA (evita conflitos)
global.smooth=0
global.shaderset=none
global.integerscale=0

## 🎯 FRAME PACING / ESTABILIDADE
global.vsync=1
global.maxfps=60

## 🎯 DRIVER SEGURO PARA INTEL
global.retroarch.video_driver=gl

## 🎯 EVITA STUTTER EM iGPU
global.retroarch.video_threaded=false

## 🎯 FRAME PACING MODERNO
global.retroarch.video_max_swapchain_images=2

## 🎯 BASE NEUTRA PARA LATÊNCIA (override por core)
global.retroarch.run_ahead_enabled=false
global.retroarch.frame_delay=0

## 🎯 SHADER GLOBAL DESATIVADO (controle por sistema)
global.retroarch.video_shader_enable=false

## 🎯 ÁUDIO ESTÁVEL (boa latência sem crackle)
global.audiolatency=64


# ------------ I - Per System Advanced Configuration ----------- #

## 🕹️ ARCADE (CPS / FBNeo)
fbneo.vsync=1
fbneo.ratio=auto

## 🕹️ MAME fallback
mame.vsync=1
mame.ratio=auto

## 🎮 Consoles clássicos (fallback seguro)
nes.ratio=auto
snes.ratio=auto
megadrive.ratio=auto
mastersystem.ratio=auto

## 🎮 PS1 (seguro)
psx.ratio=auto

## 🎮 PS2 (somente seleção de emulador — seguro)
ps2.emulator=pcsx2


# ------------ L - Other ----------- #

## DXVK (mantido desativado por padrão)
#windows.dxvk=0


# ------------ User-generated Configurations ----------- #

## 🔥 GOVERNOR CORRETO (estabilidade CPU)
system.cpu.governor=performance

## 🔒 REDE / IDENTIDADE
global.netplay.nickname=BATOCERA Player

## UI
ScrollLoadMedias=0
global.exithotkeyonly=0
